<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06120b">
<title>Naya Sawera Business Manager V3</title>
<style>
:root{--bg:#06120b;--panel:#0d1b14;--panel2:#11291b;--line:#1c3b2a;--green:#13a66a;--lime:#b5f26a;--text:#edf7ef;--muted:#8ba497;--red:#ff7777;--amber:#f0c66b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#143d29 0,transparent 34%),var(--bg);color:var(--text);font:15px system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#07140deF;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;gap:10px;align-items:center;font-weight:800}.logo{width:40px;height:40px;display:grid;place-items:center;background:linear-gradient(135deg,#13a66a,#1b5032);border-radius:13px;font-size:22px;color:var(--lime)}
.brand small{display:block;color:var(--lime);font-size:10px;letter-spacing:1px}
.wrap{max-width:1250px;margin:auto;padding:18px 14px 100px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.heading h1{margin:0;font-size:24px}.heading p{color:var(--muted);margin:5px 0}
button,.btn{border:1px solid #285039;background:#12301f;color:var(--text);border-radius:11px;padding:11px 13px;font:inherit;cursor:pointer}button:hover{border-color:var(--lime)}.primary{background:linear-gradient(135deg,#138552,#0f6e48);border-color:#269967;font-weight:700}.danger{border-color:#603333;background:#351b1b;color:#ffb3b3}.ghost{background:transparent}.small{padding:7px 9px;font-size:12px}
nav{display:flex;gap:7px;overflow:auto;padding:0 0 12px;margin-bottom:14px}nav button{white-space:nowrap;color:#9eb5a6}nav button.active{color:var(--lime);background:#183622;border-color:#2d6744}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.card,.section{background:linear-gradient(145deg,#10251a,#0b1711);border:1px solid var(--line);border-radius:17px;padding:15px}.card label{color:var(--muted);font-size:12px}.card strong{display:block;font-size:24px;margin:9px 0 3px}.card small{color:var(--muted)}
.section{margin-top:14px}.sectitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectitle h2{margin:0;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.toolbar input{flex:1;min-width:150px}
input,select,textarea{width:100%;background:#07140d;color:var(--text);border:1px solid #284735;border-radius:10px;padding:11px;font:inherit}input::placeholder,textarea::placeholder{color:#72897a}label.field{display:block;color:#9db4a4;font-size:12px;margin:10px 0 5px}
table{width:100%;border-collapse:collapse;min-width:600px;font-size:13px}th{text-align:left;color:#82998b;font-size:11px;padding:10px;border-bottom:1px solid var(--line)}td{padding:11px 10px;border-bottom:1px solid #183324}td small{color:var(--muted)}.tablewrap{overflow:auto}
.empty{text-align:center;padding:28px;color:var(--muted)}.tag{display:inline-block;border-radius:99px;background:#173d28;color:#a8e8b4;padding:4px 8px;font-size:11px}.tag.pending{background:#392d16;color:var(--amber)}.tag.overdue{background:#421e1e;color:#ffb1b1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{padding:14px;text-align:left}.quick span{display:block;font-size:21px;color:var(--lime);margin-bottom:5px}
.modal{display:none;position:fixed;inset:0;z-index:10;background:#0009;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.modalbox{background:#0b1b12;border:1px solid #2b5438;border-radius:17px;padding:17px;width:min(650px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.invoice-line{display:grid;grid-template-columns:2fr 70px 90px 80px 35px;gap:6px;align-items:center;margin:8px 0}.invoice-line input{padding:8px}.totals{margin:12px 0;text-align:right}.totals strong{font-size:21px}.hint{color:var(--muted);font-size:12px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#18452b;border:1px solid #4a8e62;padding:11px 15px;border-radius:12px;display:none;z-index:20}.toast.show{display:block}
.mobilebottom{display:none}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.heading h1{font-size:21px}.mobilebottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#06120bf5;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px;z-index:6}.mobilebottom button{border:0;background:none;padding:5px;color:#8ba497;font-size:11px}.mobilebottom button.active{color:var(--lime)}.wrap{padding-bottom:92px}.invoice-line{grid-template-columns:1.6fr 55px 75px 70px 30px}}
@media(max-width:430px){.card strong{font-size:20px}.formgrid{grid-template-columns:1fr}.heading{display:block}.heading .primary{margin-top:10px}}
@media print{body{background:white;color:black}header,nav,.heading button,.toolbar,.actions,.mobilebottom,.no-print{display:none!important}.wrap{padding:0}.card,.section{background:white;color:black;border:1px solid #ddd;break-inside:avoid}table{min-width:0}th,td{color:black}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🌱</div><div>NAYA SAWERA HALLA<small>BUSINESS MANAGER · V3.0</small></div></div><button class="small ghost" onclick="backupData()">⬇ Backup</button></header>
<div class="wrap">
<div class="heading"><div><h1 id="greeting">Good day 👋</h1><p>Live overview from your saved records.</p></div><button class="primary" onclick="openInvoice()">＋ New invoice</button></div>
<nav id="nav"></nav>
<main id="content"></main>
</div>
<div class="mobilebottom" id="mobileNav"></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="small ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='naya_sawera_v3_data';
let data=load(),page='Home';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{items:[],customers:[],invoices:[],expenses:[]}}catch(e){return{items:[],customers:[],invoices:[],expenses:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();toast('Saved successfully ✓')}
function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2})}
function id(prefix){return prefix+'-'+Date.now().toString().slice(-7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2300)}
const pages=['Home','Inventory','Invoices','Customers','Expenses','Reports','Settings'];
const icons={Home:'⌂',Inventory:'▦',Invoices:'▤',Customers:'♙',Expenses:'↘',Reports:'⌁',Settings:'⚙'};
function navHtml(){return pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${icons[p]} ${p}</button>`).join('')}
function go(p){page=p;render()}
function totals(){let sales=data.invoices.reduce((s,i)=>s+Number(i.total||0),0),expenses=data.expenses.reduce((s,e)=>s+Number(e.amount||0),0),paid=data.invoices.reduce((s,i)=>s+Number(i.paid||0),0);return{sales,expenses,net:sales-expenses,receivable:sales-paid}}
function render(){document.getElementById('nav').innerHTML=navHtml();document.getElementById('mobileNav').innerHTML=pages.filter(p=>['Home','Inventory','Invoices','Customers','Settings'].includes(p)).map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${icons[p]}<br>${p}</button>`).join('');let c=document.getElementById('content');({Home:home,Inventory:inventory,Invoices:invoices,Customers:customers,Expenses:expenses,Reports:reports,Settings:settings}[page]||home)(c)}
function kpi(label,val,sub){return `<div class="card"><label>${label}</label><strong>${val}</strong><small>${sub}</small></div>`}
function home(c){let t=totals();c.innerHTML=`<div class="cards">${kpi('SALES TOTAL',money(t.sales),'Recorded invoices')}${kpi('NET AFTER EXPENSES',money(t.net),'Sales minus expenses')}${kpi('CUSTOMERS',data.customers.length,'Saved contacts')}${kpi('ITEMS',data.items.length,'Inventory records')}</div>
<div class="section"><div class="sectitle"><h2>Quick actions</h2></div><div class="quick"><button onclick="openInvoice()"><span>＋</span>New invoice</button><button onclick="openCustomer()"><span>♙</span>Add customer</button><button onclick="openItem()"><span>▦</span>Add item</button><button onclick="openExpense()"><span>↘</span>Record expense</button></div></div>
<div class="grid2"><div class="section"><div class="sectitle"><h2>Recent invoices</h2><button class="small" onclick="go('Invoices')">All invoices</button></div>${recentInvoices()}</div><div class="section"><div class="sectitle"><h2>Business snapshot</h2></div><p>Outstanding balances: <b>${money(t.receivable)}</b></p><p>Total expenses: <b>${money(t.expenses)}</b></p><p>Inventory units: <b>${data.items.reduce((s,x)=>s+Number(x.qty||0),0)}</b></p><button onclick="backupData()">Export backup</button></div></div>`}
function recentInvoices(){if(!data.invoices.length)return `<div class="empty">No records yet. Use Quick actions to begin.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${data.invoices.slice(-5).reverse().map(i=>`<tr><td>${esc(i.id)}</td><td>${esc(i.customerName)}</td><td>${money(i.total)}</td><td>${status(i)}</td></tr>`).join('')}</tbody></table></div>`}
function status(i){let due=Number(i.total)-Number(i.paid||0);return due<=0?'<span class="tag">Paid</span>':`<span class="tag pending">Due ${money(due)}</span>`}
function inventory(c){c.innerHTML=`<div class="section"><div class="sectitle"><h2>Inventory</h2><button class="primary" onclick="openItem()">＋ Add item</button></div><div class="toolbar"><input id="itemSearch" placeholder="Search item or category…" oninput="filterItems()"><button onclick="backupData()">Export</button></div><div id="itemTable">${itemTable(data.items)}</div></div>`}
function itemTable(arr){if(!arr.length)return '<div class="empty">Inventory is empty. Add your first item.</div>';return `<div class="tablewrap"><table><thead><tr><th>ITEM</th><th>CATEGORY</th><th>QTY</th><th>BUY</th><th>SELL</th><th>TOOLS</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.note||'')}</small></td><td>${esc(x.category)}</td><td>${Number(x.qty)}</td><td>${money(x.buy)}</td><td>${money(x.sell)}</td><td><button class="small" onclick="editItem('${x.id}')">Edit</button> <button class="small danger" onclick="delItem('${x.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}
function filterItems(){let q=document.getElementById('itemSearch').value.toLowerCase();document.getElementById('itemTable').innerHTML=itemTable(data.items.filter(x=>(x.name+' '+x.category+' '+x.note).toLowerCase().includes(q)))}
function openItem(item=null){modal('Add inventory item',itemForm(item))}
function itemForm(x=null){return `<form onsubmit="saveItem(event,'${x?.id||''}')"><div class="formgrid"><div><label class="field">Item name *</label><input name="name" required value="${esc(x?.name||'')}"></div><div><label class="field">Category</label><select name="category"><option>Seeds</option><option>Tools</option><option>General goods</option><option>Other</option></select></div><div><label class="field">Quantity</label><input name="qty" type="number" min="0" step="1" value="${x?.qty??0}"></div><div><label class="field">Purchase price</label><input name="buy" type="number" min="0" step=".01" value="${x?.buy??0}"></div><div><label class="field">Selling price</label><input name="sell" type="number" min="0" step=".01" value="${x?.sell??0}"></div><div><label class="field">Note / SKU</label><input name="note" value="${esc(x?.note||'')}"></div></div><div class="actions"><button class="primary">Save item</button><button type="button" onclick="closeModal()">Cancel</button></div></form>`}
function saveItem(e,editId){e.preventDefault();let f=new FormData(e.target),x={id:editId||id('IT'),name:f.get('name').trim(),category:f.get('category'),qty:+f.get('qty'),buy:+f.get('buy'),sell:+f.get('sell'),note:f.get('note')};if(editId){let ix=data.items.findIndex(a=>a.id===editId);data.items[ix]=x}else data.items.push(x);closeModal();save()}
function editItem(i){let x=data.items.find(a=>a.id===i);modal('Edit item',itemForm(x))}
function delItem(i){if(confirm('Delete this item record?')){data.items=data.items.filter(x=>x.id!==i);save()}}
function customers(c){c.innerHTML=`<div class="section"><div class="sectitle"><h2>Customers</h2><button class="primary" onclick="openCustomer()">＋ Add customer</button></div><div class="toolbar"><input id="customerSearch" placeholder="Search customer…" oninput="filterCustomers()"></div><div id="customerTable">${customerTable(data.customers)}</div></div>`}
function customerTable(arr){if(!arr.length)return '<div class="empty">No customer records yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>NAME</th><th>PHONE</th><th>AREA</th><th>NOTE</th><th>ACTIONS</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone||'')}</td><td>${esc(x.area||'')}</td><td>${esc(x.note||'')}</td><td><button class="small" onclick="editCustomer('${x.id}')">Edit</button> <button class="small danger" onclick="delCustomer('${x.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}
function filterCustomers(){let q=document.getElementById('customerSearch').value.toLowerCase();document.getElementById('customerTable').innerHTML=customerTable(data.customers.filter(x=>(x.name+' '+x.phone+' '+x.area).toLowerCase().includes(q)))}
function openCustomer(x=null){modal(x?'Edit customer':'Add customer',customerForm(x))}
function customerForm(x=null){return `<form onsubmit="saveCustomer(event,'${x?.id||''}')"><div class="formgrid"><div><label class="field">Customer name *</label><input name="name" required value="${esc(x?.name||'')}"></div><div><label class="field">Phone</label><input name="phone" value="${esc(x?.phone||'')}"></div><div><label class="field">Area / village</label><input name="area" value="${esc(x?.area||'')}"></div><div><label class="field">Notes</label><input name="note" value="${esc(x?.note||'')}"></div></div><div class="actions"><button class="primary">Save customer</button><button type="button" onclick="closeModal()">Cancel</button></div></form>`}
function saveCustomer(e,editId){e.preventDefault();let f=new FormData(e.target),x={id:editId||id('CU'),name:f.get('name').trim(),phone:f.get('phone'),area:f.get('area'),note:f.get('note')};if(editId)data.customers[data.customers.findIndex(a=>a.id===editId)]=x;else data.customers.push(x);closeModal();save()}
function editCustomer(i){openCustomer(data.customers.find(x=>x.id===i))}
function delCustomer(i){if(confirm('Delete this customer?')){data.customers=data.customers.filter(x=>x.id!==i);save()}}
function invoices(c){c.innerHTML=`<div class="section"><div class="sectitle"><h2>Invoices</h2><button class="primary" onclick="openInvoice()">＋ Create invoice</button></div><div class="toolbar"><input id="invSearch" placeholder="Search invoice/customer…" oninput="filterInvoices()"></div><div id="invTable">${invoiceTable(data.invoices)}</div></div>`}
function invoiceTable(arr){if(!arr.length)return '<div class="empty">No invoices created yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>INVOICE</th><th>DATE</th><th>CUSTOMER</th><th>TOTAL</th><th>PAID</th><th>DUE</th><th>ACTIONS</th></tr></thead><tbody>${arr.slice().reverse().map(i=>`<tr><td>${esc(i.id)}</td><td>${esc(i.date)}</td><td>${esc(i.customerName)}</td><td>${money(i.total)}</td><td>${money(i.paid)}</td><td>${money(i.total-i.paid)}</td><td><button class="small" onclick="printInvoice('${i.id}')">Print</button> <button class="small danger" onclick="delInvoice('${i.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}
function filterInvoices(){let q=document.getElementById('invSearch').value.toLowerCase();document.getElementById('invTable').innerHTML=invoiceTable(data.invoices.filter(x=>(x.id+x.customerName+x.date).toLowerCase().includes(q)))}
function openInvoice(){modal('Create invoice',invoiceForm())}
function invoiceForm(){let opts=data.customers.map(x=>`<option value="${x.id}">${esc(x.name)}${x.phone?' · '+esc(x.phone):''}</option>`).join('');return `<form onsubmit="saveInvoice(event)"><label class="field">Customer *</label><select name="customer" required><option value="">Select customer</option>${opts}<option value="walkin">Walk-in customer</option></select><div class="formgrid"><div><label class="field">Invoice date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label class="field">Paid amount</label><input name="paid" type="number" min="0" step=".01" value="0"></div></div><label class="field">Invoice items</label><div id="invoiceLines">${lineHtml()}</div><button type="button" class="small" onclick="addLine()">＋ Add line</button><div class="totals">Total: <strong id="invoiceTotal">Rs. 0</strong></div><div class="actions"><button class="primary">Save invoice</button><button type="button" onclick="closeModal()">Cancel</button></div><p class="hint">Invoice saving adjusts the selected inventory quantities.</p></form>`}
function lineHtml(){return `<div class="invoice-line"><select class="lineitem" onchange="calcInvoice()"><option value="">Choose item</option>${data.items.map(x=>`<option value="${x.id}" data-price="${x.sell}" data-stock="${x.qty}">${esc(x.name)} · ${money(x.sell)}</option>`).join('')}</select><input class="lineqty" type="number" min="1" value="1" onchange="calcInvoice()" placeholder="Qty"><input class="lineprice" type="number" min="0" step=".01" value="0" onchange="calcInvoice()" placeholder="Price"><span class="linetotal">0</span><button type="button" class="small danger" onclick="this.parentElement.remove();calcInvoice()">×</button></div>`}
function addLine(){document.getElementById('invoiceLines').insertAdjacentHTML('beforeend',lineHtml())}
function calcInvoice(){let total=0;document.querySelectorAll('.invoice-line').forEach(row=>{let sel=row.querySelector('.lineitem'),opt=sel.options[sel.selectedIndex];let price=row.querySelector('.lineprice');if(sel.value&&price.value==='0')price.value=opt.dataset.price||0;let n=Number(row.querySelector('.lineqty').value||0)*Number(price.value||0);row.querySelector('.linetotal').textContent=money(n);total+=n});let el=document.getElementById('invoiceTotal');if(el)el.textContent=money(total);return total}
function saveInvoice(e){e.preventDefault();let f=new FormData(e.target),custId=f.get('customer'),customer=data.customers.find(x=>x.id===custId),lines=[];document.querySelectorAll('.invoice-line').forEach(r=>{let sel=r.querySelector('.lineitem');if(sel.value){let item=data.items.find(x=>x.id===sel.value),qty=Number(r.querySelector('.lineqty').value||0),price=Number(r.querySelector('.lineprice').value||0);if(item&&qty>0)lines.push({itemId:item.id,name:item.name,qty,price,total:qty*price})}});if(!lines.length){alert('Add at least one item.');return}let total=lines.reduce((s,l)=>s+l.total,0),paid=Number(f.get('paid')||0);if(paid>total){alert('Paid amount cannot be greater than invoice total.');return}for(let l of lines){let item=data.items.find(x=>x.id===l.itemId);if(item.qty<l.qty){alert('Not enough stock for '+item.name+'. Available: '+item.qty);return}}lines.forEach(l=>{let item=data.items.find(x=>x.id===l.itemId);item.qty-=l.qty});let inv={id:id('INV'),date:f.get('date'),customerId:custId,customerName:customer?.name||'Walk-in',customerPhone:customer?.phone||'',lines,total,paid};data.invoices.push(inv);closeModal();save();setTimeout(()=>printInvoice(inv.id),250)}
function delInvoice(i){if(confirm('Delete invoice? Stock quantities will be returned.')){let inv=data.invoices.find(x=>x.id===i);inv?.lines?.forEach(l=>{let item=data.items.find(x=>x.id===l.itemId);if(item)item.qty+=Number(l.qty)});data.invoices=data.invoices.filter(x=>x.id!==i);save()}}
function printInvoice(i){let inv=data.invoices.find(x=>x.id===i);if(!inv)return;let html=`<html><head><title>${inv.id}</title><style>body{font-family:Arial;padding:24px;color:#111}h1{margin:0}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}.right{text-align:right}.foot{margin-top:30px}</style></head><body onload="window.print()"><h1>Naya Sawera Halla</h1><p>Invoice / Receipt</p><hr><p><b>Invoice:</b> ${inv.id}<br><b>Date:</b> ${inv.date}<br><b>Customer:</b> ${inv.customerName}<br><b>Phone:</b> ${inv.customerPhone||'—'}</p><table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${inv.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.total)}</td></tr>`).join('')}</tbody></table><h3 class="right">Total: ${money(inv.total)}</h3><p class="right">Paid: ${money(inv.paid)}<br>Balance: ${money(inv.total-inv.paid)}</p><p class="foot">Thank you for your business.</p></body></html>`;let w=window.open('','_blank');if(!w){alert('Allow popups to print receipt.');return}w.document.write(html);w.document.close()}
function expenses(c){c.innerHTML=`<div class="section"><div class="sectitle"><h2>Expenses</h2><button class="primary" onclick="openExpense()">＋ Add expense</button></div>${expenseTable(data.expenses)}</div>`}
function expenseTable(arr){if(!arr.length)return '<div class="empty">No expenses recorded.</div>';return `<div class="tablewrap"><table><thead><tr><th>DATE</th><th>CATEGORY</th><th>DETAIL</th><th>AMOUNT</th><th>ACTION</th></tr></thead><tbody>${arr.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.detail)}</td><td>${money(x.amount)}</td><td><button class="small danger" onclick="delExpense('${x.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}
function openExpense(){modal('Record expense',`<form onsubmit="saveExpense(event)"><div class="formgrid"><div><label class="field">Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label class="field">Category</label><select name="category"><option>Rent</option><option>Utilities</option><option>Transport</option><option>Staff</option><option>Shop supplies</option><option>Other</option></select></div><div><label class="field">Amount *</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label class="field">Description</label><input name="detail"></div></div><div class="actions"><button class="primary">Save expense</button><button type="button" onclick="closeModal()">Cancel</button></div></form>`)}
function saveExpense(e){e.preventDefault();let f=new FormData(e.target);data.expenses.push({id:id('EX'),date:f.get('date'),category:f.get('category'),amount:+f.get('amount'),detail:f.get('detail')});closeModal();save()}
function delExpense(i){if(confirm('Delete expense?')){data.expenses=data.expenses.filter(x=>x.id!==i);save()}}
function reports(c){let t=totals();let month=new Date().toISOString().slice(0,7),ms=data.invoices.filter(x=>x.date?.startsWith(month)).reduce((s,x)=>s+x.total,0),me=data.expenses.filter(x=>x.date?.startsWith(month)).reduce((s,x)=>s+x.amount,0);c.innerHTML=`<div class="cards">${kpi('ALL-TIME SALES',money(t.sales),'Total invoice value')}${kpi('ALL-TIME EXPENSES',money(t.expenses),'Recorded costs')}${kpi('NET',money(t.net),'Sales minus expenses')}${kpi('OUTSTANDING',money(t.receivable),'Unpaid invoice balances')}</div><div class="grid2"><div class="section"><h2>This month</h2><p>Sales: <b>${money(ms)}</b></p><p>Expenses: <b>${money(me)}</b></p><p>Net: <b>${money(ms-me)}</b></p></div><div class="section"><h2>Counts</h2><p>Invoices: <b>${data.invoices.length}</b></p><p>Customers: <b>${data.customers.length}</b></p><p>Inventory items: <b>${data.items.length}</b></p></div></div><div class="section"><div class="sectitle"><h2>Export reports</h2></div><button onclick="csvExport('invoices')">Export invoices CSV</button> <button onclick="csvExport('expenses')">Export expenses CSV</button> <button onclick="csvExport('items')">Export inventory CSV</button></div>`}
function settings(c){c.innerHTML=`<div class="section"><h2>Settings & data</h2><p class="hint">V3 currently saves data in this browser/device. Use backup regularly. Clearing browser data may remove local records.</p><div class="actions"><button class="primary" onclick="backupData()">Download full backup</button><label class="btn">Restore backup<input type="file" accept=".json" hidden onchange="restoreData(event)"></label><button onclick="csvExport('customers')">Export customers CSV</button><button class="danger" onclick="clearData()">Delete all app data</button></div><hr><p><b>Version:</b> V3.0 Functional local edition</p><p><b>Currency:</b> PKR</p><p><b>Shop:</b> Naya Sawera Halla</p></div>`}
function backupData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='naya-sawera-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.items||!d.customers||!d.invoices||!d.expenses)throw Error('Invalid file');if(confirm('Replace current records with this backup?')){data=d;save();toast('Backup restored')}}catch(err){alert('Backup file invalid.')}};r.readAsText(f)}
function csvExport(type){let rows=data[type]||[],keys=rows.length?Object.keys(rows[0]):[];let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='naya-sawera-'+type+'.csv';a.click();URL.revokeObjectURL(a.href)}
function clearData(){if(confirm('This will permanently remove records stored on this device. Continue?')&&confirm('Are you absolutely sure?')){data={items:[],customers:[],invoices:[],expenses:[]};save()}}
function modal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.getElementById('greeting').textContent=(new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening')+' 👋';
render();
</script>
</body>
</html>
