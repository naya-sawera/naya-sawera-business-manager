<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naya Sawera Halla Business Manager</title><style>
:root{--bg:#06100b;--panel:#0d1b14;--line:#1c3b2a;--lime:#b5f26a;--muted:#8ba497;--white:#eff8f1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 18% 0%,#123a27 0,transparent 35%),var(--bg);color:var(--white);font:15px system-ui, sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.sidebar{width:230px;position:fixed;inset:0 auto 0 0;background:#050f0a;border-right:1px solid var(--line);padding:17px 13px}.brand{padding:5px 7px 20px;font-weight:800}.brand small{display:block;color:var(--lime);font-size:10px;letter-spacing:1px}.nav{padding:11px;border-radius:10px;color:#a5baad;margin:4px 0;cursor:pointer}.nav.active,.nav:hover{background:#11271b;color:white}.main{margin-left:230px;padding:22px 24px 90px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:24px}.top p{margin:5px 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi,.panel{background:linear-gradient(145deg,#10251a,#0b1711);border:1px solid #1e3c2b;border-radius:16px;padding:15px}.kpi label{font-size:12px;color:#94ad9d}.kpi strong{display:block;font-size:22px;margin:10px 0}.muted{color:var(--muted)}.panel{margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h2{font-size:16px;margin:0}.btn{background:#123321;border:1px solid #275139;color:#eaf6ed;border-radius:9px;padding:8px 11px}.primary{background:#13764d}.danger{background:#3a1d1d;border-color:#633232;color:#ffb0b0}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{text-align:left;padding:12px}.quick b{display:block;color:var(--lime);font-size:19px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:500px;font-size:13px}th{text-align:left;color:#789183;font-size:10px;padding:9px;border-bottom:1px solid #203c2b}td{padding:10px;border-bottom:1px solid #183324;color:#c4d8ca}.empty{text-align:center;padding:24px;color:var(--muted)}.modalbg{display:none;position:fixed;inset:0;background:#000a;z-index:10;align-items:center;justify-content:center;padding:12px}.modalbg.show{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#0d1b14;border:1px solid #285039;border-radius:16px;padding:17px}.mhead{display:flex;justify-content:space-between;align-items:center}.mhead h2{margin:0}.close{background:none;border:0;color:white;font-size:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.field label{display:block;color:#9bb4a3;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#07120b;border:1px solid #254733;border-radius:8px;padding:9px;color:white}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.reportbox{border:1px solid var(--line);padding:14px;border-radius:11px}.reportbox small{color:var(--muted)}.reportbox strong{display:block;margin-top:7px;font-size:20px}.mobilebar{display:none}@media(max-width:850px){.sidebar{width:190px}.main{margin-left:190px;padding:16px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.sidebar{display:none}.main{margin:0;padding:14px 12px 85px}.cards{gap:8px}.kpi{padding:12px}.kpi strong{font-size:19px}.quick{grid-template-columns:repeat(2,1fr)}.panel{padding:12px}.fields{grid-template-columns:1fr}.full{grid-column:auto}.reportgrid{grid-template-columns:1fr 1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#07110b;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:8px 2px}.mobilebar button{border:0;background:transparent;color:#91a99a;font-size:10px}.mobilebar button span{display:block;font-size:17px}.mobilebar button.active{color:var(--lime)}}
</style></head><body><aside class="sidebar"><div class="brand">🌱 NAYA SAWERA HALLA<small>BUSINESS MANAGER</small></div><div class="nav active" data-page="home">◈ Overview</div><div class="nav" data-page="stock">▦ Inventory</div><div class="nav" data-page="customers">♙ Customers</div><div class="nav" data-page="invoices">▤ Invoices</div><div class="nav" data-page="expenses">↘ Expenses</div><div class="nav" data-page="reports">⌁ Reports</div><div class="nav" data-page="settings">⚙ Settings</div></aside><main class="main"><header class="top"><div><h1 id="title">Good evening 👋</h1><p id="subtitle">Your shop overview</p></div><span class="muted">● Local save · This device</span></header><div id="content"></div></main><div class="mobilebar"><button data-page="home" class="active"><span>◈</span>Home</button><button data-page="stock"><span>▦</span>Stock</button><button data-page="invoices"><span>▤</span>Invoices</button><button data-page="customers"><span>♙</span>Customers</button><button data-page="settings"><span>⚙</span>More</button></div><div class="modalbg" id="modalbg"><div class="modal"><div class="mhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='nayaSaweraFunctionalV1';let data=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"customers":[],"invoices":[],"expenses":[]}'),page='home';const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()},money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(p){page=p==='more'?'settings':p;document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===page));render()}document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>go(e.dataset.page));function empty(t){return `<div class="empty">${t}</div>`}function table(headers,rows){if(!rows.length)return empty('No records yet. Use the Add button to start.');return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function itemTable(){return table(['ITEM','CATEGORY','QTY','PRICE','ACTIONS'],data.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td><button class="btn" onclick="adjust('${x.id}')">Adjust</button> <button class="btn danger" onclick="removeRec('items','${x.id}')">Delete</button></td></tr>`))}function custTable(){return table(['NAME','PHONE','NOTES','ACTION'],data.customers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.notes)}</td><td><button class="btn danger" onclick="removeRec('customers','${x.id}')">Delete</button></td></tr>`))}function invTable(list){return table(['ID','CUSTOMER','DATE','TOTAL','STATUS','ACTION'],list.map(x=>`<tr><td>${x.code}</td><td>${esc(x.customer)}</td><td>${esc(x.date)}</td><td>${money(x.total)}</td><td>${x.status}</td><td><button class="btn" onclick="showInvoice('${x.id}')">View</button> <button class="btn danger" onclick="removeRec('invoices','${x.id}')">Delete</button></td></tr>`))}function expTable(){return table(['DESCRIPTION','DATE','AMOUNT','ACTION'],data.expenses.slice().reverse().map(x=>`<tr><td>${esc(x.desc)}</td><td>${x.date}</td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="removeRec('expenses','${x.id}')">Delete</button></td></tr>`))}function render(){let sales=data.invoices.reduce((s,x)=>s+Number(x.total),0),ex=data.expenses.reduce((s,x)=>s+Number(x.amount),0),c=document.getElementById('content');let titleMap={home:['Good evening 👋','Your shop overview'],stock:['Inventory','Track quantities and prices'],customers:['Customers','Contact directory'],invoices:['Invoices','Sales and payment records'],expenses:['Expenses','Business expense records'],reports:['Reports','Calculated totals'],settings:['Settings & backup','Export or restore your records']};document.getElementById('title').textContent=titleMap[page][0];document.getElementById('subtitle').textContent=titleMap[page][1];if(page==='home')c.innerHTML=`<div class="cards"><div class="kpi"><label>SALES TOTAL</label><strong>${money(sales)}</strong><small>Saved invoices</small></div><div class="kpi"><label>NET AFTER EXPENSES</label><strong>${money(sales-ex)}</strong><small>Sales less expenses</small></div><div class="kpi"><label>CUSTOMERS</label><strong>${data.customers.length}</strong><small>Saved contacts</small></div><div class="kpi"><label>ITEMS</label><strong>${data.items.length}</strong><small>Inventory records</small></div></div><section class="panel"><div class="head"><h2>Quick actions</h2></div><div class="quick"><button class="btn" onclick="openInvoice()"><b>＋</b>New invoice</button><button class="btn" onclick="openCustomer()"><b>♙</b>Add customer</button><button class="btn" onclick="openItem()"><b>▦</b>Add item</button><button class="btn" onclick="openExpense()"><b>↘</b>Expense</button></div></section><section class="panel"><div class="head"><h2>Recent invoices</h2><button class="btn" onclick="go('invoices')">All invoices</button></div>${invTable(data.invoices.slice().reverse().slice(0,5))}</section><section class="panel"><div class="head"><h2>Low stock</h2></div>${table(['ITEM','QTY','ALERT LEVEL'],data.items.filter(x=>x.qty<=x.low).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${x.low}</td></tr>`))}</section>`;else if(page==='stock')c.innerHTML=`<section class="panel"><div class="head"><h2>Inventory</h2><button class="btn primary" onclick="openItem()">＋ Add item</button></div>${itemTable()}</section>`;else if(page==='customers')c.innerHTML=`<section class="panel"><div class="head"><h2>Customers</h2><button class="btn primary" onclick="openCustomer()">＋ Add customer</button></div>${custTable()}</section>`;else if(page==='invoices')c.innerHTML=`<section class="panel"><div class="head"><h2>Invoices</h2><button class="btn primary" onclick="openInvoice()">＋ New invoice</button></div>${invTable(data.invoices.slice().reverse())}</section>`;else if(page==='expenses')c.innerHTML=`<section class="panel"><div class="head"><h2>Expenses</h2><button class="btn primary" onclick="openExpense()">＋ Record expense</button></div>${expTable()}</section>`;else if(page==='reports')c.innerHTML=`<div class="reportgrid"><div class="reportbox"><small>Total sales</small><strong>${money(sales)}</strong></div><div class="reportbox"><small>Total expenses</small><strong>${money(ex)}</strong></div><div class="reportbox"><small>Net</small><strong>${money(sales-ex)}</strong></div><div class="reportbox"><small>Invoices</small><strong>${data.invoices.length}</strong></div><div class="reportbox"><small>Customers</small><strong>${data.customers.length}</strong></div><div class="reportbox"><small>Items</small><strong>${data.items.length}</strong></div></div>`;else c.innerHTML=`<section class="panel"><div class="head"><h2>Backup / restore</h2></div><p class="muted">Save a backup file regularly. Records are stored in this browser only.</p><button class="btn primary" onclick="backup()">Download backup</button> <label class="btn">Import backup<input hidden type="file" accept=".json" onchange="restore(event)"></label><p style="color:#f2bd58;margin-top:20px">This is not cloud-sync. Browser storage can be lost if browser data is cleared.</p><button class="btn danger" onclick="wipe()">Clear all records</button><p class="muted">For general shop bookkeeping, inventory, invoices and expenses.</p>`}function modal(t,html){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalbg').classList.add('show')}function closeModal(){document.getElementById('modalbg').classList.remove('show')}function field(label,name,type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" required ${extra}></div>`}function form(fields,fn){return `<form onsubmit="${fn}(this);return false"><div class="fields">${fields}</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`}function openItem(){modal('Add item',form(field('Name','name')+`<div class="field"><label>Category</label><select name="category"><option>General goods</option><option>Seeds</option><option>Tools</option><option>Other</option></select></div>`+field('Quantity','qty','number','min="0"')+field('Unit price Rs.','price','number','min="0" step="0.01"')+field('Low stock threshold','low','number','min="0"'), 'saveItem'))}function saveItem(f){let d=new FormData(f);data.items.push({id:crypto.randomUUID(),name:d.get('name'),category:d.get('category'),qty:+d.get('qty'),price:+d.get('price'),low:+d.get('low')||3});closeModal();save()}function adjust(id){let x=data.items.find(i=>i.id===id),q=prompt('Set new quantity for '+x.name,x.qty);if(q===null||q===''||+q<0)return;x.qty=+q;save()}function openCustomer(){modal('Add customer',form(field('Name','name')+field('Phone','phone','tel')+`<div class="field full"><label>Notes</label><textarea name="notes"></textarea></div>`,'saveCustomer'))}function saveCustomer(f){let d=new FormData(f);data.customers.push({id:crypto.randomUUID(),name:d.get('name'),phone:d.get('phone'),notes:d.get('notes')});closeModal();save()}function openInvoice(){let itemOpts=data.items.map(i=>`<option value="${i.id}">${esc(i.name)} — qty ${i.qty} — ${i.price}</option>`).join('');modal('New invoice',`<form onsubmit="saveInvoice(this);return false"><div class="fields"><div class="field"><label>Customer</label><input name="customer" list="customers" required><datalist id="customers">${data.customers.map(c=>`<option>${esc(c.name)}</option>`).join('')}</datalist></div>${field('Date','date','date',`value="${new Date().toISOString().slice(0,10)}"`)}<div class="field full"><label>Inventory item (optional)</label><select name="item"><option value="">Custom item</option>${itemOpts}</select></div>${field('Description','desc')}${field('Quantity','qty','number','min="1" value="1"')}${field('Unit price Rs.','price','number','min="0" step="0.01"')}<div class="field"><label>Status</label><select name="status"><option>Paid</option><option>Pending</option></select></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save invoice</button></div></form>`)}function saveInvoice(f){let d=new FormData(f),itm=data.items.find(i=>i.id===d.get('item')),qty=+d.get('qty'),price=+d.get('price');if(itm){if(itm.qty<qty){alert('Not enough quantity available.');return}if(!d.get('price'))price=itm.price;itm.qty-=qty}let n=data.invoices.length+1;data.invoices.push({id:crypto.randomUUID(),code:'NS-'+String(n).padStart(5,'0'),customer:d.get('customer'),date:d.get('date'),desc:d.get('desc')||(itm?itm.name:'Sale'),qty,price,total:qty*price,status:d.get('status')});closeModal();save()}function showInvoice(id){let x=data.invoices.find(i=>i.id===id);alert(`${x.code}\nCustomer: ${x.customer}\nDate: ${x.date}\n${x.desc} × ${x.qty}\nUnit: ${money(x.price)}\nTotal: ${money(x.total)}\n${x.status}`)}function openExpense(){modal('Record expense',form(field('Description','desc')+field('Date','date','date',`value="${new Date().toISOString().slice(0,10)}"`)+field('Amount Rs.','amount','number','min="0" step="0.01"'),'saveExpense'))}function saveExpense(f){let d=new FormData(f);data.expenses.push({id:crypto.randomUUID(),desc:d.get('desc'),date:d.get('date'),amount:+d.get('amount')});closeModal();save()}function removeRec(t,id){if(confirm('Delete this record?')){data[t]=data[t].filter(x=>x.id!==id);save()}}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='naya-sawera-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.items||!d.customers||!d.invoices||!d.expenses)throw 0;if(confirm('Import this backup and replace current data?')){data=d;save();alert('Backup restored')}}catch{alert('Backup file not valid')}};r.readAsText(file)}function wipe(){if(confirm('Erase all records? Export a backup first.')){data={items:[],customers:[],invoices:[],expenses:[]};save()}}render();
</script></body></html>
